<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CGI Form - webserv</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==">
</head>
<body>
    <div class="container">
        <h1>CGI Form</h1>
        <p class="subtitle">Send POST data to a CGI script</p>
        <form action="/cgi-bin/form.py" method="POST">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Your name">

            <label for="message">Message:</label>
            <textarea id="message" name="message" placeholder="Type something..."></textarea>

            <button type="submit">Send to CGI</button>
        </form>
        <p><a href="/">&larr; Back to home</a></p>
    </div>
</body>
</html>
